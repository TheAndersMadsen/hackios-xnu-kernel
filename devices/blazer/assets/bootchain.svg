<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" role="img" aria-label="Boot chain: fastboot boot to XNU to SpringBoard">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12253a"/>
      <stop offset="1" stop-color="#0d1b2c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7df"/>
      <stop offset="1" stop-color="#6aa8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6aa8ff"/>
    </marker>
  </defs>
  <rect width="1160" height="300" rx="18" fill="#0a0f1c"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="34" y="42" font-size="21" font-weight="700" fill="#e8f1ff">The delivery chain — RAM only, no flash</text>
    <text x="34" y="68" font-size="15" fill="#8fa8c0">slot A stays stock · watchdog armed · rdinit=/xni is Magisk-immune</text>
  </g>

  <!-- boxes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- ABL -->
    <rect x="30" y="104" width="180" height="96" rx="12" fill="url(#box)" stroke="#2b4a6b"/>
    <text x="120" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#8fd6ff">fastboot boot</text>
    <text x="120" y="166" text-anchor="middle" font-size="13" fill="#9db4cc">ABL + AVB footer</text>
    <text x="120" y="186" text-anchor="middle" font-size="13" fill="#9db4cc">loader into RAM</text>

    <!-- Linux -->
    <rect x="252" y="104" width="200" height="96" rx="12" fill="url(#box)" stroke="#2b4a6b"/>
    <text x="352" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#8fd6ff">mainline Linux</text>
    <text x="352" y="166" text-anchor="middle" font-size="13" fill="#9db4cc">probe + display diag</text>
    <text x="352" y="186" text-anchor="middle" font-size="13" fill="#9db4cc">root via F2FS ro-mount</text>

    <!-- kexec -->
    <rect x="494" y="104" width="180" height="96" rx="12" fill="url(#box)" stroke="url(#acc)"/>
    <text x="584" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#5ee7df">kexec_load</text>
    <text x="584" y="166" text-anchor="middle" font-size="13" fill="#9db4cc">EL1 · x0 = 0</text>
    <text x="584" y="186" text-anchor="middle" font-size="13" fill="#9db4cc">boot_args via pmsg</text>

    <!-- XNU -->
    <rect x="716" y="104" width="190" height="96" rx="12" fill="url(#box)" stroke="url(#acc)"/>
    <text x="811" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#5ee7df">XNU 8796</text>
    <text x="811" y="166" text-anchor="middle" font-size="13" fill="#9db4cc">marker 0x5A5A5A5A</text>
    <text x="811" y="186" text-anchor="middle" font-size="13" fill="#9db4cc">BSD root: md0</text>

    <!-- SpringBoard -->
    <rect x="948" y="104" width="182" height="96" rx="12" fill="url(#box)" stroke="#2b4a6b"/>
    <text x="1039" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#8fd6ff">launchd → UI</text>
    <text x="1039" y="166" text-anchor="middle" font-size="13" fill="#9db4cc">daemons, backboardd</text>
    <text x="1039" y="186" text-anchor="middle" font-size="13" fill="#9db4cc">SpringBoard render</text>
  </g>

  <!-- arrows -->
  <g stroke="#6aa8ff" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <path d="M212 152 H246"/>
    <path d="M454 152 H488"/>
    <path d="M676 152 H710"/>
    <path d="M908 152 H942"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="34" y="248" font-size="14" fill="#7e97b1">Evidence: pstore console + pmsg MARKER-SCRATCH + PANIC-CAPTURED (unslid, symbolicated backtrace)</text>
    <text x="34" y="274" font-size="14" fill="#7e97b1">Phone absent from adb &gt; 12 min after the jump ⇒ XNU is running headless — that is evidence, not a hang.</text>
  </g>
</svg>
